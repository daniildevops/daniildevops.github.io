name: Deploy site

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read        # только чтение репо, Pages-права больше не нужны

concurrency:
  group: 'deploy'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to TimeWeb via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/           # папка после npm run build
          server-dir: ${{ secrets.FTP_SERVER_DIR }}  # путь на TimeWeb
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
